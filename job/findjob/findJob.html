<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <style>
        body { background: #f5f6fa; padding-top: 70px; }

        .hero {
            background: linear-gradient(135deg, rgba(31,17,45,1) 0%, #3a1f5c 100%);
            padding: 50px 0 40px;
            color: #fff;
        }

        .search-bar {
            background: #fff;
            border-radius: 50px;
            padding: 10px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 520px;
        }
        .search-bar input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 0.95rem;
        }

        .job-card {
            border: none;
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            background: #fff;
        }
        .job-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.13);
        }

        .card-thumb {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .card-thumb i.main-icon { font-size: 3rem; color: rgba(255,255,255,0.5); }

        .badge-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 6px;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.4);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            color: #fff;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .delete-btn:hover { background: #e22c18; }

        .tag-pill {
            background: #f0f0f0;
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 0.78rem;
            color: #555;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .tag-pill.remote  { background: #e8f5e9; color: #2e7d32; }
        .tag-pill.full    { background: #e3f2fd; color: #1565c0; }
        .tag-pill.part    { background: #fff3e0; color: #e65100; }

        .salary-tag {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e22c18;
        }

        .contact-row {
            background: #fafafa;
            border-top: 1px solid #f0f0f0;
            padding: 10px 16px;
            font-size: 0.82rem;
            color: #555;
        }

        .no-results { text-align: center; padding: 60px 0; color: #999; }
    </style>
</head>
<body>
    <script>
      if (!localStorage.getItem('token')) { window.location.replace('/signin/sign.html'); }
    </script>

    <nav class="navbar navbar-expand-lg fixed-top bg-white shadow-sm" style="height:70px;">
        <div class="container-fluid">
          <a class="navbar-brand" href="/index.html">
            <i class="fa-solid fa-magnifying-glass" style="background:#e22c18;padding:5px;border-radius:50%;color:#fff;"></i>
            Locate<span style="color:#e22c18;">Space</span>
          </a>
          <div class="navbar-nav me-auto">
            <a class="nav-link" href="/index.html">Home</a>
            <a class="nav-link" href="/property/house.html">Properties</a>
            <a class="nav-link" href="/job/job.html">Jobs</a>
            <a class="nav-link" href="/myPosts.html">My Posts</a>
          </div>
          <div id="navAuth"></div>
        </div>
    </nav>
    <script>
      (function() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        const el = document.getElementById('navAuth');
        if (token && user) {
          el.innerHTML = '<span class="me-3 fw-semibold">Hi, ' + user.name + '</span><button class="btn btn-outline-danger btn-sm" onclick="localStorage.clear();window.location.reload()">Logout</button>';
        } else {
          el.innerHTML = '<a href="/signin/sign.html"><button class="btn btn-danger">Login</button></a>';
        }
      })();
    </script>

    <div class="hero">
        <div class="container px-4 d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h1 class="fw-bold mb-1">Find Jobs</h1>
                <p class="mb-4" style="color:rgba(255,255,255,0.7);">Explore opportunities near you</p>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass text-muted"></i>
                    <input type="text" id="search" placeholder="Search by title, company, city, or category…">
                </div>
            </div>
            <a href="/job/uploadjob/uploadJob.html" style="text-decoration:none;">
                <button class="btn btn-danger mt-2"><i class="fa-solid fa-plus me-2"></i>Post a Job</button>
            </a>
        </div>
    </div>

    <div class="container py-4">
        <div id="count-label" class="text-muted small mb-3"></div>
        <div class="row g-4" id="jobs-container">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-danger" role="status"></div>
                <p class="mt-2 text-muted">Loading jobs…</p>
            </div>
        </div>
    </div>

    <script>
      const GRADIENTS = {
        engineering:      'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
        it:               'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
        delivery:         'linear-gradient(135deg, #f7971e 0%, #ffd200 100%)',
        marketing:        'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
        accounting:       'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
        medicine:         'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)',
        agriculture:      'linear-gradient(135deg, #56ab2f 0%, #a8e063 100%)',
        security:         'linear-gradient(135deg, #373b44 0%, #4286f4 100%)',
        teaching:         'linear-gradient(135deg, #fc4a1a 0%, #f7b733 100%)',
        'customer-service':'linear-gradient(135deg, #ee9ca7 0%, #ffdde1 100%)',
      };

      const ICONS = {
        engineering:       'fa-gears',
        it:                'fa-laptop-code',
        delivery:          'fa-truck',
        marketing:         'fa-bullhorn',
        accounting:        'fa-file-invoice-dollar',
        medicine:          'fa-stethoscope',
        agriculture:       'fa-wheat-awn',
        security:          'fa-shield',
        teaching:          'fa-chalkboard-user',
        'customer-service':'fa-headset',
      };

      const DEFAULT_GRADIENT = 'linear-gradient(135deg, #868f96 0%, #596164 100%)';
      const DEFAULT_ICON     = 'fa-briefcase';

      let allJobs = [];
      const currentUserId = (JSON.parse(localStorage.getItem('user') || 'null') || {}).id;

      function renderCard(j) {
        const cat      = (j.category || '').toLowerCase();
        const gradient = GRADIENTS[cat] || DEFAULT_GRADIENT;
        const icon     = ICONS[cat]     || DEFAULT_ICON;
        const catLabel = j.category ? j.category.charAt(0).toUpperCase() + j.category.slice(1) : 'General';
        const location = [j.city, j.district].filter(Boolean).join(', ') || '';
        const desc     = j.description ? (j.description.length > 80 ? j.description.slice(0,80)+'…' : j.description) : '';
        const isOwner  = j.postedBy && currentUserId && j.postedBy === currentUserId;

        const modeClass = j.jobMode === 'remote' ? 'remote' : j.jobType === 'full-time' ? 'full' : j.jobType === 'part-time' ? 'part' : '';

        const tags = [
          j.jobType ? `<span class="tag-pill ${modeClass}"><i class="fa-solid fa-clock"></i> ${j.jobType}</span>` : '',
          j.jobMode ? `<span class="tag-pill ${j.jobMode === 'remote' ? 'remote' : ''}"><i class="fa-solid fa-${j.jobMode === 'remote' ? 'wifi' : 'building'}"></i> ${j.jobMode}</span>` : '',
          j.experience ? `<span class="tag-pill"><i class="fa-solid fa-medal"></i> ${j.experience}</span>` : '',
        ].filter(Boolean).join('');

        return `
          <div class="col-md-6 col-lg-4" id="card-${j._id}">
            <div class="job-card h-100 d-flex flex-column">
              <div class="card-thumb" style="background:${gradient};">
                <i class="fa-solid ${icon} main-icon"></i>
                <div class="badge-overlay">
                  <span class="badge" style="background:#e22c18;">${catLabel}</span>
                </div>
                ${isOwner ? `<button class="delete-btn" onclick="deleteJob('${j._id}')" title="Delete"><i class="fa-solid fa-trash"></i></button>` : ''}
              </div>

              <div class="card-body p-3 flex-grow-1 d-flex flex-column">
                <h5 class="fw-bold mb-1" style="font-size:1rem;">${j.title}</h5>
                ${j.company ? `<p class="mb-1 fw-semibold" style="color:#444;font-size:0.88rem;"><i class="fa-solid fa-building me-1 text-muted"></i>${j.company}</p>` : ''}
                ${location ? `<p class="text-muted small mb-2"><i class="fa-solid fa-location-dot me-1"></i>${location}</p>` : ''}
                ${tags ? `<div class="d-flex flex-wrap gap-1 mb-2">${tags}</div>` : ''}
                ${desc ? `<p class="small text-secondary mb-2">${desc}</p>` : ''}
                <div class="mt-auto pt-2">
                  ${j.salary ? `<div class="salary-tag"><i class="fa-solid fa-money-bill-wave me-1" style="font-size:0.9rem;"></i>${j.salary}</div>` : ''}
                </div>
              </div>

              <div class="contact-row">
                ${j.contactName  ? `<div><i class="fa-solid fa-user me-1 text-muted"></i>${j.contactName}</div>` : ''}
                <div class="d-flex gap-3 mt-1">
                  ${j.contactPhone ? `<span><i class="fa-solid fa-phone me-1 text-muted"></i>${j.contactPhone}</span>` : ''}
                  ${j.contactEmail ? `<span><i class="fa-solid fa-envelope me-1 text-muted"></i>${j.contactEmail}</span>` : ''}
                </div>
              </div>
            </div>
          </div>`;
      }

      function applyFilter(query) {
        const q = query.toLowerCase().trim();
        const filtered = q
          ? allJobs.filter(j =>
              (j.title    || '').toLowerCase().includes(q) ||
              (j.company  || '').toLowerCase().includes(q) ||
              (j.city     || '').toLowerCase().includes(q) ||
              (j.category || '').toLowerCase().includes(q)
            )
          : allJobs;

        const container = document.getElementById('jobs-container');
        const countEl   = document.getElementById('count-label');

        if (filtered.length === 0) {
          container.innerHTML = '<div class="col-12 no-results"><i class="fa-solid fa-briefcase fa-2x mb-3"></i><p>No jobs found.</p></div>';
          countEl.textContent = '';
        } else {
          container.innerHTML = filtered.map(renderCard).join('');
          countEl.textContent = filtered.length + ' job' + (filtered.length > 1 ? 's' : '') + ' found';
        }
      }

      async function deleteJob(id) {
        if (!confirm('Delete this job posting?')) return;
        const token = localStorage.getItem('token');
        try {
          const res = await fetch('/api/jobs/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (res.ok) {
            allJobs = allJobs.filter(j => j._id !== id);
            applyFilter(document.getElementById('search').value);
          } else {
            alert('Could not delete. Please try again.');
          }
        } catch {
          alert('Server error.');
        }
      }

      async function loadJobs() {
        const container = document.getElementById('jobs-container');
        try {
          const res = await fetch('/api/jobs');
          allJobs = await res.json();

          const params = new URLSearchParams(window.location.search);
          const cat = params.get('category');
          if (cat) {
            document.getElementById('search').value = cat;
            applyFilter(cat);
          } else {
            applyFilter('');
          }
        } catch {
          container.innerHTML = '<p class="text-danger">Failed to load jobs. Make sure the server is running.</p>';
        }
      }

      document.getElementById('search').addEventListener('input', function() {
        applyFilter(this.value);
      });

      loadJobs();
    </script>
</body>
</html>
