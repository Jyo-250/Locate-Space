<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Post a Job</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <style>
      body { background: #f5f6fa; padding-top: 80px; }
      .form-select { height: 40px; }
      .btn-group { border-radius: 0.5rem; }
      .section-card { border: none; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
      @media screen and (max-width:900px){ .side-img{ display: none; } }
    </style>
  </head>
  <body>
    <script>
      if (!localStorage.getItem('token')) { window.location.replace('/signin/sign.html'); }
    </script>

    <nav class="navbar navbar-expand-lg fixed-top bg-white shadow-sm" style="height:70px;">
      <div class="container-fluid">
        <a class="navbar-brand" href="/index.html">
          <i class="fa-solid fa-magnifying-glass" style="background:#e22c18;padding:5px;border-radius:50%;color:#fff;"></i>
          Locate<span style="color:#e22c18;">Space</span>
        </a>
        <div class="navbar-nav me-auto">
          <a class="nav-link" href="/index.html">Home</a>
          <a class="nav-link" href="/property/house.html">Properties</a>
          <a class="nav-link active" href="/job/job.html">Jobs</a>
        </div>
        <div id="navAuth"></div>
      </div>
    </nav>
    <script>
      (function() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        const el = document.getElementById('navAuth');
        if (token && user) {
          el.innerHTML = '<span class="me-3 fw-semibold">Hi, ' + user.name + '</span><button class="btn btn-outline-danger btn-sm" onclick="localStorage.clear();window.location.reload()">Logout</button>';
        } else {
          el.innerHTML = '<a href="/signin/sign.html"><button class="btn btn-danger">Login</button></a>';
        }
      })();
    </script>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-8">
          <div class="mb-4">
            <h1 class="fw-bold">Post a Job</h1>
            <p class="text-muted">Fill in the details below to list your job opening</p>
          </div>

          <!-- Basic Info -->
          <section class="card section-card card-body p-4 mb-4">
            <h2 class="h5 mb-4"><i class="fa-solid fa-circle-info me-2" style="color:#e22c18;"></i>Basic Info</h2>
            <div class="mb-3">
              <label class="form-label" for="title">Job Title <span class="text-danger">*</span></label>
              <input class="form-control" type="text" id="title" placeholder="e.g. Software Engineer, Delivery Executive">
            </div>
            <div class="mb-3">
              <label class="form-label" for="company">Company Name</label>
              <input class="form-control" type="text" id="company" placeholder="e.g. Infosys, Swiggy">
            </div>
            <div class="row">
              <div class="col-sm-6 mb-3">
                <label class="form-label" for="category">Job Category <span class="text-danger">*</span></label>
                <select class="form-select py-0" id="category">
                  <option value="">Choose category</option>
                  <option value="engineering">Engineering</option>
                  <option value="it">IT / Software</option>
                  <option value="delivery">Delivery</option>
                  <option value="marketing">Marketing</option>
                  <option value="accounting">Accounting / Finance</option>
                  <option value="medicine">Medicine / Healthcare</option>
                  <option value="agriculture">Agriculture</option>
                  <option value="security">Security</option>
                  <option value="teaching">Teaching / Education</option>
                  <option value="customer-service">Customer Service</option>
                </select>
              </div>
              <div class="col-sm-6 mb-3">
                <label class="form-label" for="jobType">Job Type</label>
                <select class="form-select py-0" id="jobType">
                  <option value="">Choose type</option>
                  <option value="full-time">Full-time</option>
                  <option value="part-time">Part-time</option>
                  <option value="contract">Contract</option>
                  <option value="internship">Internship</option>
                </select>
              </div>
            </div>
          </section>

          <!-- Job Details -->
          <section class="card section-card card-body p-4 mb-4">
            <h2 class="h5 mb-4"><i class="fa-solid fa-pen-to-square me-2" style="color:#e22c18;"></i>Job Details</h2>

            <div class="mb-4">
              <label class="form-label d-block fw-semibold mb-2">Work Mode</label>
              <div class="btn-group btn-group-sm" role="group">
                <input class="btn-check" type="radio" id="onsite" name="jobMode" value="on-site">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="onsite">On-site</label>
                <input class="btn-check" type="radio" id="remote" name="jobMode" value="remote">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="remote">Remote</label>
                <input class="btn-check" type="radio" id="hybrid" name="jobMode" value="hybrid">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="hybrid">Hybrid</label>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label d-block fw-semibold mb-2">Experience Required</label>
              <div class="btn-group btn-group-sm" role="group">
                <input class="btn-check" type="radio" id="exp0" name="experience" value="0-1 years">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="exp0">0-1 yr</label>
                <input class="btn-check" type="radio" id="exp1" name="experience" value="1-3 years">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="exp1">1-3 yrs</label>
                <input class="btn-check" type="radio" id="exp3" name="experience" value="3-5 years">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="exp3">3-5 yrs</label>
                <input class="btn-check" type="radio" id="exp5" name="experience" value="5+ years">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="exp5">5+ yrs</label>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="description">Job Description</label>
              <textarea class="form-control" id="description" rows="5" placeholder="Describe the role, responsibilities, and requirements…"></textarea>
            </div>
          </section>

          <!-- Location -->
          <section class="card section-card card-body p-4 mb-4">
            <h2 class="h5 mb-4"><i class="fa-solid fa-location-dot me-2" style="color:#e22c18;"></i>Location</h2>
            <div class="row">
              <div class="col-sm-6 mb-3">
                <label class="form-label" for="city">City <span class="text-danger">*</span></label>
                <select class="form-select py-0" id="city">
                  <option value="">Choose city</option>
                  <option value="Mumbai">Mumbai</option>
                  <option value="Bangalore">Bangalore</option>
                  <option value="Hyderabad">Hyderabad</option>
                  <option value="Delhi">Delhi</option>
                  <option value="Kurnool">Kurnool</option>
                  <option value="Nellore">Nellore</option>
                  <option value="Tirupati">Tirupati</option>
                </select>
              </div>
              <div class="col-sm-6 mb-3">
                <label class="form-label" for="district">District</label>
                <select class="form-select py-0" id="district">
                  <option value="">Choose district</option>
                  <option value="Kurnool">Kurnool</option>
                  <option value="Nellore">Nellore</option>
                  <option value="Chittoor">Chittoor</option>
                  <option value="Tirupati">Tirupati</option>
                </select>
              </div>
            </div>
          </section>

          <!-- Salary -->
          <section class="card section-card card-body p-4 mb-4">
            <h2 class="h5 mb-4"><i class="fa-solid fa-money-bills me-2" style="color:#e22c18;"></i>Salary</h2>
            <div class="mb-3" style="max-width:320px;">
              <label class="form-label" for="salary">Salary / Compensation</label>
              <input class="form-control" type="text" id="salary" placeholder="e.g. ₹25,000/month or Negotiable">
            </div>
          </section>

          <!-- Contact -->
          <section class="card section-card card-body p-4 mb-4">
            <h2 class="h5 mb-4"><i class="fa-solid fa-phone-volume me-2" style="color:#e22c18;"></i>Contact Details</h2>
            <div class="row">
              <div class="col-sm-6 mb-3">
                <label class="form-label" for="contactFirstName">First Name <span class="text-danger">*</span></label>
                <input class="form-control" type="text" id="contactFirstName">
              </div>
              <div class="col-sm-6 mb-3">
                <label class="form-label" for="contactLastName">Last Name</label>
                <input class="form-control" type="text" id="contactLastName">
              </div>
            </div>
            <div class="row">
              <div class="col-sm-6 mb-3">
                <label class="form-label" for="contactPhone">Phone Number <span class="text-danger">*</span></label>
                <input class="form-control" type="text" id="contactPhone">
              </div>
              <div class="col-sm-6 mb-3">
                <label class="form-label" for="contactEmail">Email</label>
                <input class="form-control" type="email" id="contactEmail">
              </div>
            </div>
          </section>

          <div id="uploadError" class="text-danger text-center mb-2" style="display:none;"></div>
          <button id="saveBtn" class="btn btn-danger btn-lg d-block mx-auto mb-5" style="width:220px;">Post Job</button>

          <script>
            document.getElementById('saveBtn').addEventListener('click', async function() {
              const token = localStorage.getItem('token');
              if (!token) { window.location.replace('/signin/sign.html'); return; }

              const title             = document.getElementById('title').value.trim();
              const company           = document.getElementById('company').value.trim();
              const category          = document.getElementById('category').value;
              const jobType           = document.getElementById('jobType').value;
              const jobModeEl         = document.querySelector('input[name="jobMode"]:checked');
              const experienceEl      = document.querySelector('input[name="experience"]:checked');
              const description       = document.getElementById('description').value.trim();
              const city              = document.getElementById('city').value;
              const district          = document.getElementById('district').value;
              const salary            = document.getElementById('salary').value.trim();
              const contactFirstName  = document.getElementById('contactFirstName').value.trim();
              const contactLastName   = document.getElementById('contactLastName').value.trim();
              const contactPhone      = document.getElementById('contactPhone').value.trim();
              const contactEmail      = document.getElementById('contactEmail').value.trim();

              const errorEl = document.getElementById('uploadError');
              errorEl.style.display = 'none';

              if (!title || !category || !city || !contactFirstName || !contactPhone) {
                errorEl.textContent = 'Please fill in title, category, city, and contact details.';
                errorEl.style.display = 'block';
                return;
              }

              const payload = {
                title,
                company,
                category,
                jobType,
                jobMode:     jobModeEl    ? jobModeEl.value    : undefined,
                experience:  experienceEl ? experienceEl.value : undefined,
                description,
                city,
                district,
                salary,
                contactName:  contactFirstName + (contactLastName ? ' ' + contactLastName : ''),
                contactPhone,
                contactEmail,
              };

              try {
                const res = await fetch('/api/jobs', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                  body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) { errorEl.textContent = data.message; errorEl.style.display = 'block'; return; }
                alert('Job posted successfully!');
                window.location.href = '/job/findjob/findJob.html';
              } catch {
                errorEl.textContent = 'Server error. Try again.';
                errorEl.style.display = 'block';
              }
            });
          </script>
        </div>

        <div class="col-md-4 side-img">
          <div style="position:fixed;top:90px;width:280px;">
            <div class="card section-card p-4 text-center">
              <i class="fa-solid fa-briefcase fa-3x mb-3" style="color:#e22c18;"></i>
              <h5 class="fw-bold">Reach thousands of candidates</h5>
              <p class="text-muted small">Post your job for free and connect with the right talent in your area.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
