<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Upload details</title>
    <link rel="stylesheet" href="upload.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <style>
      .form-select{ height: 40px; }
      .btn-group{ border-radius: 0.5rem; }
      @media screen and (max-width:900px){ img{ display: none; } }
    </style>
  </head>
  <body>
    <script>
      if (!localStorage.getItem('token')) { window.location.replace('/signin/sign.html'); }
    </script>
    <div class="container mt-5">
      <div class="row">
        <div class="col-md-8">
          <div class="mb-4">
            <h1>Add Property</h1>
          </div>

          <section class="card card-body shadow-sm border-0 p-4 mb-4">
            <h2 class="h4 mb-4"><i class="fa-solid fa-circle-info" style="color: #e22c18;"></i> Basic Info</h2>
            <div class="mb-3">
              <label class="form-label" for="title">Title<span class="text-danger">*</span></label>
              <input class="form-control" type="text" id="title" placeholder="Title for your property" required>
            </div>
            <div class="row">
              <div class="col-sm-6">
                <label class="form-label" for="category">Category<span class="text-danger">*</span></label>
                <select class="form-select py-0" id="category" required>
                  <option value="">Choose category</option>
                  <option value="rent">For Rent</option>
                  <option value="sale">For Sale</option>
                </select>
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="propertyType">Property type<span class="text-danger">*</span></label>
                <select class="form-select py-0" id="propertyType" required>
                  <option value="">Choose property type</option>
                  <option value="apartment">Apartment</option>
                  <option value="house">House</option>
                  <option value="daily-rental">Daily Rental</option>
                  <option value="shop">Shop / Commercial</option>
                </select>
              </div>
            </div>
          </section>

          <section class="card card-body shadow-sm border-0 p-4 mb-4">
            <h2 class="h4 mb-4"><i class="fa-solid fa-location-dot" style="color: #e22c18;"></i> Location</h2>
            <div class="row">
              <div class="col-sm-6 mb-3">
                <label class="form-label" for="country">Country/Region<span class="text-danger">*</span></label>
                <select class="form-select py-0" id="country" required style="height: 40px;">
                  <option value="">Choose country</option>
                  <option value="India">India</option>
                  <option value="United States">United States</option>
                  <option value="Sri Lanka">Sri Lanka</option>
                </select>
              </div>
              <div class="col-sm-6 mb-3">
                <label class="form-label" for="city">City<span class="text-danger">*</span></label>
                <select class="form-select py-0" id="city" required>
                  <option value="">Choose city</option>
                  <option value="Mumbai">Mumbai</option>
                  <option value="Bangalore">Bangalore</option>
                  <option value="Hyderabad">Hyderabad</option>
                  <option value="Delhi">Delhi</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="col-sm-8 mb-3">
                <label class="form-label" for="district">District<span class="text-danger">*</span></label>
                <select class="form-select py-0" id="district" required>
                  <option value="">Choose district</option>
                  <option value="Kurnool">Kurnool</option>
                  <option value="Nellore">Nellore</option>
                  <option value="Chittoor">Chittoor</option>
                  <option value="Tirupati">Tirupati</option>
                </select>
              </div>
              <div class="col-sm-4 mb-3">
                <label class="form-label" for="zipCode">Zip code</label>
                <input class="form-control" type="text" id="zipCode">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="address">Street Address</label>
              <input class="form-control" type="text" id="address">
            </div>
            <div class="mb-2">
              <label class="form-label">Display on the map</label>
              <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d122843.21987710104!2d77.9574002508482!3d15.811828665329157!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bb5ddf506b7c6c9%3A0x19a7ac74f858d6f2!2sKurnool%2C%20Andhra%20Pradesh!5e0!3m2!1sen!2sin!4v1714737845762!5m2!1sen!2si" width="470" height="250" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
          </section>

          <section class="card card-body shadow-sm border-0 p-4 mb-4">
            <h2 class="h4 mb-4"><i class="fa-solid fa-pen-to-square" style="color: #e22c18;"></i> Property details</h2>
            <div class="mb-4" style="max-width: 25rem;">
              <label class="form-label" for="area">Total area, sq.m</label>
              <input class="form-control" type="number" id="area" min="20">
            </div>
            <div class="mb-4">
              <label class="form-label d-block fw-bold pb-1 mb-2">Bedrooms</label>
              <div class="btn-group btn-group-sm" role="group">
                <input class="btn-check" type="radio" id="studio" name="bedrooms" value="Studio">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="studio">Studio</label>
                <input class="btn-check" type="radio" id="bedroom-1" name="bedrooms" value="1">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="bedroom-1">1</label>
                <input class="btn-check" type="radio" id="bedroom-2" name="bedrooms" value="2">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="bedroom-2">2</label>
                <input class="btn-check" type="radio" id="bedroom-3" name="bedrooms" value="3">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="bedroom-3">3</label>
                <input class="btn-check" type="radio" id="bedroom-4" name="bedrooms" value="4">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="bedroom-4">4</label>
                <input class="btn-check" type="radio" id="bedroom-5" name="bedrooms" value="5+">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="bedroom-5">5+</label>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label d-block pb-1 mb-2 fw-bold">Bathrooms</label>
              <div class="btn-group btn-group-sm" role="group">
                <input class="btn-check" type="radio" id="bathroom-1" name="bathrooms" value="1">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="bathroom-1">1</label>
                <input class="btn-check" type="radio" id="bathroom-2" name="bathrooms" value="2">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="bathroom-2">2</label>
                <input class="btn-check" type="radio" id="bathroom-3" name="bathrooms" value="3">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="bathroom-3">3</label>
                <input class="btn-check" type="radio" id="bathroom-4" name="bathrooms" value="4">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="bathroom-4">4</label>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label d-block fw-bold pb-1 mb-2">Parking spots</label>
              <div class="btn-group btn-group-sm" role="group">
                <input class="btn-check" type="radio" id="parking-1" name="parking" value="1">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="parking-1">1</label>
                <input class="btn-check" type="radio" id="parking-2" name="parking" value="2">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="parking-2">2</label>
                <input class="btn-check" type="radio" id="parking-3" name="parking" value="3">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="parking-3">3</label>
                <input class="btn-check" type="radio" id="parking-4" name="parking" value="4">
                <label class="btn btn-outline-secondary fw-normal p-2 px-3" for="parking-4">4</label>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label" for="description">Description</label>
              <textarea class="form-control" id="description" rows="5" placeholder="Describe your property"></textarea>
            </div>
          </section>

          <section class="card card-body shadow-sm border-0 p-4 mb-4">
            <h2 class="h4 mb-4"><i class="fa-solid fa-money-bills" style="color: #e22c18;"></i> Price</h2>
            <div class="mb-4">
              <label class="form-label" for="price">Price <span class="text-danger">*</span></label>
              <div class="row">
                <div class="col-sm-8">
                  <input class="form-control" type="number" id="price" min="0" required>
                </div>
                <div class="col-sm-4">
                  <select class="form-select py-0" id="priceUnit">
                    <option value="month">per month</option>
                    <option value="day">per day</option>
                    <option value="week">per week</option>
                    <option value="year">per year</option>
                  </select>
                </div>
              </div>
            </div>
          </section>

          <section class="card card-body shadow-sm border-0 p-4 mb-4">
            <h2 class="h4 mb-4"><i class="fa-regular fa-image" style="color: #e22c18;"></i> Photos / Video</h2>
            <div class="alert alert-primary" role="alert">
              <div class="d-flex">
                <i class="fa-solid fa-circle-exclamation me-2 mt-1" style="color: #3c76f2;"></i>
                <p class="fs-sm mb-0" style="color: #3c76f2;">The maximum photo size is 8 MB. Formats: jpg, jpeg or png<br>Put the main picture first. The maximum video size is 10 MB</p>
              </div>
            </div>
            <div class="border p-4">
              <button class="btn btn-danger" style="margin-left:160px;"><i class="fa-solid fa-cloud-arrow-up"></i> Upload photos/video</button>
              <h5 class="text-muted p-2" style="margin-left:170px;">or drag them in</h5>
            </div>
          </section>

          <section class="card card-body shadow-sm border-0 p-4 mb-4">
            <h2 class="h4 mb-4"><i class="fa-solid fa-phone-volume" style="color: #e22c18;"></i> Contacts</h2>
            <div class="row">
              <div class="col-sm-6">
                <label class="form-label" for="contactFirstName">First name<span class="text-danger">*</span></label>
                <input class="form-control" type="text" required id="contactFirstName">
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="contactLastName">Last name</label>
                <input class="form-control" type="text" id="contactLastName">
              </div>
            </div>
            <div class="row mt-3">
              <div class="col-sm-6">
                <label class="form-label" for="contactEmail">Email</label>
                <input class="form-control" type="email" id="contactEmail">
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="contactPhone">Phone number<span class="text-danger">*</span></label>
                <input class="form-control" type="text" required id="contactPhone">
              </div>
            </div>
          </section>

          <div id="uploadError" class="text-danger text-center mb-2" style="display:none;"></div>
          <button id="saveBtn" class="btn btn-danger btn-lg" style="display: block;margin: auto;width: 220px;margin-bottom: 20px;">Save and Continue</button>

          <script>
            document.getElementById('saveBtn').addEventListener('click', async function() {
              const token = localStorage.getItem('token');
              if (!token) { window.location.replace('/signin/sign.html'); return; }

              const title = document.getElementById('title').value.trim();
              const category = document.getElementById('category').value;
              const propertyType = document.getElementById('propertyType').value;
              const city = document.getElementById('city').value;
              const district = document.getElementById('district').value;
              const address = document.getElementById('address').value.trim();
              const area = document.getElementById('area').value;
              const bedroomsEl = document.querySelector('input[name="bedrooms"]:checked');
              const bathroomsEl = document.querySelector('input[name="bathrooms"]:checked');
              const parkingEl = document.querySelector('input[name="parking"]:checked');
              const description = document.getElementById('description').value.trim();
              const price = document.getElementById('price').value;
              const priceUnit = document.getElementById('priceUnit').value;
              const contactFirstName = document.getElementById('contactFirstName').value.trim();
              const contactLastName = document.getElementById('contactLastName').value.trim();
              const contactEmail = document.getElementById('contactEmail').value.trim();
              const contactPhone = document.getElementById('contactPhone').value.trim();

              const errorEl = document.getElementById('uploadError');
              errorEl.style.display = 'none';

              if (!title || !city || !price || !contactFirstName || !contactPhone) {
                errorEl.textContent = 'Please fill in title, city, price, and contact details.';
                errorEl.style.display = 'block';
                return;
              }

              const payload = {
                title,
                category,
                propertyType,
                city,
                district,
                address,
                area: area ? Number(area) : undefined,
                bedrooms: bedroomsEl ? bedroomsEl.value : undefined,
                bathrooms: bathroomsEl ? bathroomsEl.value : undefined,
                parking: parkingEl ? parkingEl.value : undefined,
                description,
                price: Number(price),
                priceUnit,
                contactName: contactFirstName + (contactLastName ? ' ' + contactLastName : ''),
                contactEmail,
                contactPhone,
              };

              try {
                const res = await fetch('/api/listings', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                  body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) { errorEl.textContent = data.message; errorEl.style.display = 'block'; return; }
                alert('Listing posted successfully!');
                window.location.href = '/property/findProperty/findProperty.html';
              } catch {
                errorEl.textContent = 'Server error. Try again.';
                errorEl.style.display = 'block';
              }
            });
          </script>
        </div>

        <div class="col-md-4">
          <img src="https://th.bing.com/th/id/OIP.dXFQMhfAUGJhG-pQ7WIeuAHaHa?w=600&h=600&rs=1&pid=ImgDetMain" style="width:350px; position:fixed;top: 0;margin-top: 40px;height: 400px;">
        </div>
      </div>
    </div>
  </body>
</html>
