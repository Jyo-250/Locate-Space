<html>
    <head>
        <title>Find Property</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
        <style>
            body { background: #f5f6fa; padding-top: 70px; }

            .hero {
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                padding: 50px 0 40px;
                color: #fff;
            }

            .search-bar {
                background: #fff;
                border-radius: 50px;
                padding: 10px 20px;
                box-shadow: 0 2px 12px rgba(0,0,0,0.08);
                display: flex;
                align-items: center;
                gap: 10px;
                max-width: 520px;
            }
            .search-bar input {
                border: none;
                outline: none;
                flex: 1;
                font-size: 0.95rem;
            }

            .listing-card {
                border: none;
                border-radius: 14px;
                overflow: hidden;
                transition: transform 0.2s, box-shadow 0.2s;
                box-shadow: 0 2px 12px rgba(0,0,0,0.07);
                background: #fff;
            }
            .listing-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 8px 28px rgba(0,0,0,0.13);
            }

            .card-thumb {
                height: 155px;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }
            .card-thumb i.main-icon { font-size: 3rem; color: rgba(255,255,255,0.55); }

            .badge-overlay {
                position: absolute;
                top: 12px;
                left: 12px;
                display: flex;
                gap: 6px;
            }

            .delete-btn {
                position: absolute;
                top: 10px;
                right: 10px;
                background: rgba(0,0,0,0.4);
                border: none;
                border-radius: 50%;
                width: 30px;
                height: 30px;
                color: #fff;
                font-size: 0.75rem;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: background 0.2s;
            }
            .delete-btn:hover { background: #e22c18; }

            .amenity-pill {
                background: #f0f0f0;
                border-radius: 20px;
                padding: 3px 10px;
                font-size: 0.78rem;
                color: #555;
                display: flex;
                align-items: center;
                gap: 4px;
            }

            .price-tag {
                font-size: 1.2rem;
                font-weight: 700;
                color: #e22c18;
            }
            .price-tag span {
                font-size: 0.8rem;
                font-weight: 400;
                color: #888;
            }

            .contact-row {
                background: #fafafa;
                border-top: 1px solid #f0f0f0;
                padding: 10px 16px;
                font-size: 0.82rem;
                color: #555;
            }

            .no-results { text-align: center; padding: 60px 0; color: #999; }
        </style>
    </head>
    <body>
        <script>
          if (!localStorage.getItem('token')) { window.location.replace('/signin/sign.html'); }
        </script>

        <nav class="navbar navbar-expand-lg fixed-top bg-white shadow-sm" style="height:70px;">
            <div class="container-fluid">
              <a class="navbar-brand" href="/index.html">
                <i class="fa-solid fa-magnifying-glass" style="background:#e22c18;padding:5px;border-radius:50%;color:#fff;"></i>
                Locate<span style="color:#e22c18;">Space</span>
              </a>
              <div class="navbar-nav me-auto">
                <a class="nav-link" href="/index.html">Home</a>
                <a class="nav-link" href="/property/house.html">Properties</a>
                <a class="nav-link" href="/job/job.html">Jobs</a>
                <a class="nav-link" href="/myPosts.html">My Posts</a>
              </div>
              <div id="navAuth"></div>
            </div>
        </nav>
        <script>
          (function() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            const el = document.getElementById('navAuth');
            if (token && user) {
              el.innerHTML = '<span class="me-3 fw-semibold">Hi, ' + user.name + '</span><button class="btn btn-outline-danger btn-sm" onclick="localStorage.clear();window.location.reload()">Logout</button>';
            } else {
              el.innerHTML = '<a href="/signin/sign.html"><button class="btn btn-danger">Login</button></a>';
            }
          })();
        </script>

        <div class="hero">
            <div class="container px-4 d-flex justify-content-between align-items-start flex-wrap gap-3">
                <div>
                    <h1 class="fw-bold mb-1">Find a Property</h1>
                    <p class="mb-4" style="color:rgba(255,255,255,0.7);">Browse houses, apartments, and commercial spaces</p>
                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass text-muted"></i>
                        <input type="text" id="search" placeholder="Search by title, city, or type…">
                    </div>
                </div>
                <a href="/property/upload/upload.html" style="text-decoration:none;">
                    <button class="btn btn-danger mt-2"><i class="fa-solid fa-plus me-2"></i>Post a Property</button>
                </a>
            </div>
        </div>

        <div class="container py-4">
            <div id="count-label" class="text-muted small mb-3"></div>
            <div class="row g-4" id="listings-container">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-danger" role="status"></div>
                    <p class="mt-2 text-muted">Loading listings…</p>
                </div>
            </div>
        </div>

        <script>
          const GRADIENTS = {
            house:         'linear-gradient(135deg, #f5576c 0%, #f093fb 100%)',
            apartment:     'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            shop:          'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            'daily-rental':'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
          };
          const ICONS = {
            house: 'fa-house',
            apartment: 'fa-building',
            shop: 'fa-store',
            'daily-rental': 'fa-calendar-days',
          };
          const TYPE_LABELS = {
            house: 'House', apartment: 'Apartment',
            'daily-rental': 'Daily Rental', shop: 'Shop',
          };

          let allListings = [];
          const currentUserId = (JSON.parse(localStorage.getItem('user') || 'null') || {}).id;

          function renderCard(l) {
            const pType    = l.propertyType || l.type || '';
            const typeLabel = TYPE_LABELS[pType] || pType || 'Property';
            const catLabel  = l.category === 'rent' ? 'For Rent' : l.category === 'sale' ? 'For Sale' : '';
            const gradient  = GRADIENTS[pType] || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            const icon      = ICONS[pType] || 'fa-building-user';
            const location  = [l.city, l.district].filter(Boolean).join(', ');
            const desc      = l.description ? (l.description.length > 75 ? l.description.slice(0,75) + '…' : l.description) : '';
            const isOwner   = l.postedBy && currentUserId && l.postedBy === currentUserId;

            const amenities = [
              l.area     ? `<span class="amenity-pill"><i class="fa-solid fa-expand"></i> ${l.area} sq.m</span>` : '',
              l.bedrooms ? `<span class="amenity-pill"><i class="fa-solid fa-bed"></i> ${l.bedrooms} Bed</span>` : '',
              l.bathrooms? `<span class="amenity-pill"><i class="fa-solid fa-bath"></i> ${l.bathrooms} Bath</span>` : '',
              l.parking  ? `<span class="amenity-pill"><i class="fa-solid fa-car"></i> ${l.parking} Park</span>` : '',
            ].filter(Boolean).join('');

            return `
              <div class="col-md-6 col-lg-4" id="card-${l._id}">
                <div class="listing-card h-100 d-flex flex-column">
                  <div class="card-thumb" style="background:${gradient};">
                    <i class="fa-solid ${icon} main-icon"></i>
                    <div class="badge-overlay">
                      <span class="badge" style="background:#e22c18;">${typeLabel}</span>
                      ${catLabel ? `<span class="badge bg-dark bg-opacity-75">${catLabel}</span>` : ''}
                    </div>
                    ${isOwner ? `<button class="delete-btn" onclick="deleteListing('${l._id}')" title="Delete"><i class="fa-solid fa-trash"></i></button>` : ''}
                  </div>

                  <div class="card-body p-3 flex-grow-1 d-flex flex-column">
                    <h5 class="fw-bold mb-1" style="font-size:1rem;">${l.title}</h5>
                    ${location ? `<p class="text-muted small mb-2"><i class="fa-solid fa-location-dot me-1"></i>${location}</p>` : ''}
                    ${l.address ? `<p class="text-muted small mb-2" style="font-size:0.78rem;">${l.address}</p>` : ''}
                    ${amenities ? `<div class="d-flex flex-wrap gap-1 mb-2">${amenities}</div>` : ''}
                    ${desc ? `<p class="small text-secondary mb-2">${desc}</p>` : ''}
                    <div class="mt-auto pt-2">
                      <div class="price-tag">₹${l.price.toLocaleString('en-IN')}<span> / ${l.priceUnit || 'month'}</span></div>
                    </div>
                  </div>

                  <div class="contact-row">
                    ${l.contactName  ? `<div><i class="fa-solid fa-user me-1 text-muted"></i>${l.contactName}</div>` : ''}
                    <div class="d-flex gap-3 mt-1">
                      ${l.contactPhone ? `<span><i class="fa-solid fa-phone me-1 text-muted"></i>${l.contactPhone}</span>` : ''}
                      ${l.contactEmail ? `<span><i class="fa-solid fa-envelope me-1 text-muted"></i>${l.contactEmail}</span>` : ''}
                    </div>
                  </div>
                </div>
              </div>`;
          }

          function applyFilter(query) {
            const q = query.toLowerCase().trim();
            const filtered = q
              ? allListings.filter(l =>
                  (l.title || '').toLowerCase().includes(q) ||
                  (l.city  || '').toLowerCase().includes(q) ||
                  (l.district || '').toLowerCase().includes(q) ||
                  (l.propertyType || l.type || '').toLowerCase().includes(q)
                )
              : allListings;

            const container = document.getElementById('listings-container');
            const countEl   = document.getElementById('count-label');

            if (filtered.length === 0) {
              container.innerHTML = '<div class="col-12 no-results"><i class="fa-solid fa-house-circle-xmark fa-2x mb-3"></i><p>No listings found.</p></div>';
              countEl.textContent = '';
            } else {
              container.innerHTML = filtered.map(renderCard).join('');
              countEl.textContent = filtered.length + ' listing' + (filtered.length > 1 ? 's' : '') + ' found';
            }
          }

          async function deleteListing(id) {
            if (!confirm('Delete this listing?')) return;
            const token = localStorage.getItem('token');
            try {
              const res = await fetch('/api/listings/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
              });
              if (res.ok) {
                allListings = allListings.filter(l => l._id !== id);
                applyFilter(document.getElementById('search').value);
              } else {
                alert('Could not delete. Please try again.');
              }
            } catch {
              alert('Server error.');
            }
          }

          async function loadListings() {
            const container = document.getElementById('listings-container');
            try {
              const res = await fetch('/api/listings');
              allListings = await res.json();

              // pre-filter from URL param e.g. ?type=house
              const params = new URLSearchParams(window.location.search);
              const type = params.get('type');
              if (type) {
                document.getElementById('search').value = type;
                applyFilter(type);
              } else {
                applyFilter('');
              }
            } catch {
              container.innerHTML = '<p class="text-danger">Failed to load listings. Make sure the server is running.</p>';
            }
          }

          document.getElementById('search').addEventListener('input', function() {
            applyFilter(this.value);
          });

          loadListings();
        </script>
    </body>
</html>
